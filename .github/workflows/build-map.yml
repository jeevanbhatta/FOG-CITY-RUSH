name: Build map data

# Downloads every district in tools/districts.py from OpenStreetMap (Overpass API),
# bakes data/<district>.json and commits the files back to the branch that ran.
on:
  push:
    paths:
      - tools/fetch_osm.py
      - tools/districts.py
      - tools/build_map.py
      - .github/workflows/build-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/fetch_osm.py
        timeout-minutes: 25
      - run: python3 tools/build_map.py
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Map data unchanged."
          else
            git commit -m "Update district map data from OpenStreetMap"
            # Other commits may have landed while the download ran.
            for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep 5; done
          fi
